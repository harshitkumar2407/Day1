<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            color: wheat;
            box-sizing:border-box;
            font-family:'helvetica neue'; 
        }
        html, body {
            height: 100%;
            width: 100%;
            background-color: #444;
        }
        .loading{
            border: #888 4.3px solid ;
            width: 500px;
            height: 500px;
            animation:load 5s linear infinite ;
            border-top: red 20px solid !important;
            border-radius: 50% ;
        }
        @keyframes load{
            0%{
                transform: rotate(0deg);
            }
            25%{
                transform: rotate(90deg);
            }
            50%{
                transform: rotate(180deg);
            }
            100%{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="loading">
        <!-- hello -->
    </div>
    
</body>
</html>
